services:
  web:
    build: .
    image: wedding-invitation
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    # mọi biến trong .env (database, Cloudinary, SMTP, backup) được đưa vào container
    env_file: .env
    volumes:
      - wedding-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/wishes').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wedding-data:
